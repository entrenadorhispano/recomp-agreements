<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f0e8" />
    <title>Hola, mundo</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        background: #f4f0e8;
        color: #183b35;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background-image: radial-gradient(#183b3514 0.8px, transparent 0.8px);
        background-size: 18px 18px;
      }

      main {
        width: min(100%, 760px);
        padding: clamp(36px, 9vw, 88px);
        border: 1px solid #183b3530;
        background: #fbf9f4;
        box-shadow: 12px 12px 0 #d9e2ce;
        animation: arrive 650ms ease-out both;
      }

      p {
        margin: 0 0 22px;
        color: #a4482d;
        font: 700 0.75rem/1.2 Arial, sans-serif;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 9ch;
        margin: 0;
        font-size: clamp(3.5rem, 12vw, 7.5rem);
        font-weight: 400;
        line-height: 0.88;
      }

      h1 span {
        color: #a4482d;
      }

      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p>Un pequeño comienzo</p>
      <h1>Hola,<br /><span>mundo.</span></h1>
    </main>
  </body>
</html>
